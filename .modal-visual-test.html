<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal visual test</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="site" src="index.html"></iframe>
    <script>
      const frame = document.getElementById('site');

      frame.addEventListener('load', () => {
        setTimeout(() => {
          frame.contentWindow.openModal('Handmade Soap');
        }, 1200);
      });
    </script>
  </body>
</html>
